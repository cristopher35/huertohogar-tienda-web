<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Administrador - HuertoHogar</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <div class="admin-sidebar-marca">
          <img src="../img/logo-huertohogar.jpg" alt="Logo HuertoHogar" class="logo" />
          <span>HuertoHogar</span>
        </div>
        <nav>
          <a href="index.html">Inicio</a>
          <a href="productos.html">Productos</a>
          <a href="usuarios.html" id="link-usuarios">Usuarios</a>
          <a href="../index.html">Volver a la tienda</a>
          <a href="#" id="link-cerrar-sesion-admin">Cerrar sesión</a>
        </nav>
      </aside>
      <main class="admin-content">
        <h2 id="saludo-admin">¡Hola Administrador!</h2>
        <p>Desde aquí puedes gestionar el catálogo de productos y los usuarios del sistema.</p>
      </main>
    </div>

    <script src="../js/utilidades.js"></script>
    <script src="../js/productos-data.js"></script>
    <script src="../js/usuarios-data.js"></script>
    <script src="../js/auth.js"></script>
    <script>
      const sesionAdmin = Auth.requerirRol(["Administrador", "Vendedor"], "../login.html");
      if (sesionAdmin) {
        document.getElementById("saludo-admin").textContent = "¡Hola " + sesionAdmin.nombre + "!";
        if (sesionAdmin.tipo === "Vendedor") {
          document.getElementById("link-usuarios").remove();
        }
      }
    </script>
  </body>
</html>
