<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Producto - Administrador HuertoHogar</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <div class="admin-sidebar-marca">
          <img src="../img/logo-huertohogar.jpg" alt="Logo HuertoHogar" class="logo" />
          <span>HuertoHogar</span>
        </div>
        <nav>
          <a href="index.html">Inicio</a>
          <a href="productos.html">Productos</a>
          <a href="usuarios.html" id="link-usuarios">Usuarios</a>
          <a href="../index.html">Volver a la tienda</a>
          <a href="#" id="link-cerrar-sesion-admin">Cerrar sesión</a>
        </nav>
      </aside>
      <main class="admin-content">
        <h2 id="titulo-form-producto">Nuevo producto</h2>

        <form id="form-producto" novalidate>
          <div class="campo">
            <label for="codigo">Código de producto</label>
            <input type="text" id="codigo" name="codigo" required minlength="3" />
            <span class="error" id="error-codigo"></span>
          </div>

          <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required maxlength="100" />
            <span class="error" id="error-nombre"></span>
          </div>

          <div class="campo">
            <label for="descripcion">Descripción (opcional)</label>
            <textarea id="descripcion" name="descripcion" rows="4" maxlength="500"></textarea>
            <span class="error" id="error-descripcion"></span>
          </div>

          <div class="campo">
            <label for="precio">Precio (CLP)</label>
            <input type="number" id="precio" name="precio" min="0" step="0.01" required />
            <span class="error" id="error-precio"></span>
          </div>

          <div class="campo">
            <label for="unidad">Unidad de venta (ej: kilo, frasco de 500g)</label>
            <input type="text" id="unidad" name="unidad" />
          </div>

          <div class="campo">
            <label for="stock">Stock</label>
            <input type="number" id="stock" name="stock" min="0" step="1" required />
            <span class="error" id="error-stock"></span>
          </div>

          <div class="campo">
            <label for="stockCritico">Stock crítico (opcional)</label>
            <input type="number" id="stockCritico" name="stockCritico" min="0" step="1" />
            <span class="error" id="error-stockCritico"></span>
          </div>

          <div class="campo">
            <label for="categoria">Categoría</label>
            <select id="categoria" name="categoria" required>
              <option value="">-- Seleccione la categoría --</option>
            </select>
            <span class="error" id="error-categoria"></span>
          </div>

          <div class="campo">
            <label for="imagen">Ruta de imagen (opcional)</label>
            <input type="text" id="imagen" name="imagen" placeholder="img/nombre-archivo.jpg" />
          </div>

          <button type="submit" class="boton">Guardar producto</button>
          <p id="mensaje-exito-producto" class="mensaje-exito" hidden>Producto guardado correctamente.</p>
        </form>
      </main>
    </div>

    <script src="../js/utilidades.js"></script>
    <script src="../js/productos-data.js"></script>
    <script src="../js/usuarios-data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/validacion.js"></script>
    <script src="../js/admin-productos.js"></script>
    <script>
      const sesionAdmin = Auth.requerirRol(["Administrador"], "../login.html");
    </script>
  </body>
</html>
